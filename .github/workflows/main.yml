name: Maseer New Client Video Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  process-new-clients:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript fonts-dejavu fonts-freefont-ttf fonts-noto-core

      - name: Fix ImageMagick Policy
        run: |
          sudo mkdir -p /etc/ImageMagick-6
          sudo tee /etc/ImageMagick-6/policy.xml > /dev/null << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <policymap>
            <policy domain="resource" name="memory" value="256MiB"/>
            <policy domain="resource" name="map" value="512MiB"/>
            <policy domain="resource" name="width" value="16KP"/>
            <policy domain="resource" name="height" value="16KP"/>
            <policy domain="resource" name="area" value="128MP"/>
            <policy domain="resource" name="disk" value="1GiB"/>
            <policy domain="coder" rights="read|write" pattern="TEXT" />
            <policy domain="coder" rights="read|write" pattern="LABEL" />
            <policy domain="coder" rights="read|write" pattern="MVG" />
            <policy domain="coder" rights="read|write" pattern="MSVG" />
            <policy domain="coder" rights="read|write" pattern="PS" />
            <policy domain="coder" rights="read|write" pattern="PS2" />
            <policy domain="coder" rights="read|write" pattern="PS3" />
            <policy domain="coder" rights="read|write" pattern="XPS" />
            <policy domain="coder" rights="read|write" pattern="EPHEMERAL" />
            <policy domain="coder" rights="read|write" pattern="URL" />
            <policy domain="coder" rights="read|write" pattern="HTTPS" />
            <policy domain="path" rights="read|write" pattern="@*" />
          </policymap>
          EOF

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run New Client Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🎬 Maseer Broadcast Pipeline - Processing New Client Signups"
          python -m src.main

      - name: Upload Generated Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-client-videos
          path: output/*.mp4
          retention-days: 7

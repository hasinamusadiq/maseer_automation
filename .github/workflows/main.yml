name: Maseer Automation Runner

on:
  push:
    branches: [ main ]
    paths:
      - 'data/clients.json'
      - 'src/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Specific client to process (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript fonts-dejavu fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p logos
          mkdir -p output

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPECIFIC_CLIENT: ${{ github.event.inputs.client_name }}
        run: |
          if [ -n "$SPECIFIC_CLIENT" ]; then
            echo "Processing specific client: $SPECIFIC_CLIENT"
            python -c "
import json
with open('data/clients.json', 'r') as f:
    clients = json.load(f)
filtered = [c for c in clients if c['brand_name'] == '$SPECIFIC_CLIENT']
if filtered:
    with open('data/clients.json', 'w') as f:
        json.dump(filtered, f, indent=2)
    print(f'Filtered to {len(filtered)} client(s)')
else:
    print('Client not found, processing all')
"
          fi
          python -m src.main

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

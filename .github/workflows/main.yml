name: Maseer Automation Runner

on:
  push:
    branches: [ main ]
    paths:
      - 'data/clients.json'
      - 'src/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Specific client to process (leave empty for all)'
        required: false
        type: string

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Advanced ImageMagick Policy Fix
        run: |
          sudo cat <<EOF | sudo tee /etc/ImageMagick-6/policy.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <policymap>
            <policy domain="resource" name="memory" value="256MiB"/>
            <policy domain="resource" name="map" value="512MiB"/>
            <policy domain="resource" name="width" value="16KP"/>
            <policy domain="resource" name="height" value="16KP"/>
            <policy domain="resource" name="area" value="128MP"/>
            <policy domain="resource" name="disk" value="1GiB"/>
            <policy domain="coder" rights="read|write" pattern="EPHEMERAL" />
            <policy domain="coder" rights="read|write" pattern="URL" />
            <policy domain="coder" rights="read|write" pattern="HTTPS" />
            <policy domain="coder" rights="read|write" pattern="MVG" />
            <policy domain="coder" rights="read|write" pattern="MSVG" />
            <policy domain="coder" rights="read|write" pattern="SVG" />
            <policy domain="coder" rights="read|write" pattern="LABEL" />
            <policy domain="coder" rights="read|write" pattern="TEXT" />
            <policy domain="coder" rights="read|write" pattern="DATA" />
            <policy domain="coder" rights="read|write" pattern="GPGL" />
            <policy domain="path" rights="read|write" pattern="@*" />
          </policymap>
          EOF

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript
          
      - name: Install Persian/Arabic Fonts
        run: |
          sudo apt-get install -y fonts-dejavu fonts-freefont-ttf fonts-noto-core
          echo "Available fonts:"
          fc-list : family | grep -i -E "(dejavu|free|noto|arabic|persian)" | head -20 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests moviepy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Directories
        run: |
          mkdir -p logos
          mkdir -p output

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPECIFIC_CLIENT: ${{ github.event.inputs.client_name }}
        run: |
          if [ -n "$SPECIFIC_CLIENT" ]; then
            echo "Processing specific client: $SPECIFIC_CLIENT"
            python -c "
import json
with open('data/clients.json', 'r') as f:
    clients = json.load(f)
filtered = [c for c in clients if c['brand_name'] == '$SPECIFIC_CLIENT']
if filtered:
    with open('data/clients.json', 'w') as f:
        json.dump(filtered, f, indent=2)
    print(f'Filtered to {len(filtered)} client(s)')
else:
    print('Client not found, processing all')
"
          fi
          python -m src.main

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

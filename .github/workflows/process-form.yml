```yaml
name: Process New Client from Portal

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

permissions:
  contents: write
  issues: write

jobs:
  process-frontend-signup:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'new-client') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests pillow
          
      - name: Parse Form and Add Client
        id: parse
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "🎯 Processing new client from Portal"
          echo "Issue #$ISSUE_NUMBER"
          python .github/scripts/update_clients.py
          
      - name: Commit updated clients.json
        if: steps.parse.outputs.updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Maseer Bot"
          git add data/clients.json logos/
          git commit -m "🎯 New client: Issue #${{ github.event.issue.number || github.event.inputs.issue_number }}" || echo "No changes"
          git push || echo "Nothing to push"
          
      - name: Trigger Video Generation
        if: steps.parse.outputs.updated == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: main.yml
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Comment Success
        if: steps.parse.outputs.updated == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Client Registered!**\n\nYour video will be ready within 6 hours.\n\nTrack progress: [Actions](https://github.com/${{ github.repository }}/actions)`
            });
            github.rest.issues.update({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['new-client', 'processed']
            });

name: Process Registration + Generate Undeniable Sample

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

permissions:
  contents: write
  issues: write

jobs:
  process-and-generate-sample:
    runs-on: ubuntu-latest
    if: |
      (contains(github.event.issue.labels.*.name, 'new-client') && 
       !contains(github.event.issue.labels.*.name, 'processed')) ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Create Directories
        run: |
          mkdir -p data logos output
          ls -la data/ || echo "Creating fresh"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            ghostscript \
            fonts-dejavu \
            fonts-freefont-ttf \
            fonts-noto-core \
            fonts-noto-arabic \
            ffmpeg

      - name: Configure ImageMagick
        run: |
          sudo mkdir -p /etc/ImageMagick-6
          sudo tee /etc/ImageMagick-6/policy.xml > /dev/null << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <policymap>
            <policy domain="resource" name="memory" value="1GiB"/>
            <policy domain="resource" name="map" value="2GiB"/>
            <policy domain="resource" name="width" value="32KP"/>
            <policy domain="resource" name="height" value="32KP"/>
            <policy domain="resource" name="area" value="256MP"/>
            <policy domain="resource" name="disk" value="4GiB"/>
            <policy domain="coder" rights="read|write" pattern="*" />
            <policy domain="path" rights="read|write" pattern="@*" />
          </policymap>
          EOF

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Parse Registration Form
        id: parse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "🎯 Processing registration"
          python src/update_clients.py
          
      - name: Generate Undeniable Sample Video
        if: steps.parse.outputs.updated == 'true'
        id: sample
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAMPLE_CLIENT: ${{ steps.parse.outputs.brand_name }}
        run: |
          echo "🎬 GENERATING UNDENIABLE SAMPLE for ${{ steps.parse.outputs.brand_name }}"
          echo "Resolution: 1224×1536 | Campaign: SAMPLE (Maximum Impact)"
          python src/main.py --sample --client "${{ steps.parse.outputs.brand_name }}"
          
      - name: Commit Data
        if: steps.parse.outputs.updated == 'true'
        run: |
          git config --local user.email "maseer@automation.bot"
          git config --local user.name "Maseer Sample Bot"
          git add data/clients.json logos/
          git commit -m "🎯 ${{ steps.parse.outputs.brand_name }}: Registration + Sample Generated" || echo "No changes"
          git push

      - name: Comment Success
        if: steps.parse.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const brand = '${{ steps.parse.outputs.brand_name }}';
            const sampleSuccess = '${{ steps.sample.outcome }}' === 'success';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ ${brand} - Registration Complete\n\n${sampleSuccess ? '🎬 **UNDENIABLE SAMPLE VIDEO GENERATED**' : '⚠️ Sample generation encountered issues'}\n\n### 📱 Your Video Specifications\n- **Resolution:** 1224×1536 pixels (4:5 Aspect Ratio)\n- **Optimized for:** Instagram Feed, Stories, Facebook\n- **Delivery:** Check your Telegram now\n\n### 📅 Daily Campaign Schedule (Kabul Time)\n| Time | Campaign | Language | Visual Style |\n|------|----------|----------|--------------|\n| 6:00 AM | Morning Motivation | Persian/Dari | Celestial Minimalism |\n| 12:00 PM | General Information | Pashto | Organic Hujra |\n| 6:00 PM | Service Promotion | Persian/Dari | Modern Classic |\n| 12:00 AM | Brand Awareness | English | Tactile Stop-Motion |\n\n**Next video:** Tomorrow at 6:00 AM Kabul time\n\n*Maseer Media - Precision-Crafted for Afghan Brands*`
            });
            
            github.rest.issues.update({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['new-client', 'processed', 'sample-generated']
            });
            
      - name: Comment Failure
        if: steps.parse.outputs.updated == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Registration Failed\n\nPlease check:\n- ✓ Brand Name provided\n- ✓ Industry selected\n- ✓ Primary Color in hex format (e.g., #6B21A8)\n- ✓ Logo uploaded successfully\n\n**Need help?** Contact support@maseer.media`
            });

name: Process New Client Form

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  process-form:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'new-client') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Parse Issue and Update Clients
        id: parse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: python .github/scripts/update_clients.py
          
      - name: Commit updated clients.json
        if: steps.parse.outputs.updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/clients.json
          git commit -m "Add new client from issue #${{ github.event.issue.number || github.event.inputs.issue_number }}"
          git push
          
      - name: Trigger Video Generation
        if: steps.parse.outputs.updated == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: main.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Comment on Issue
        if: steps.parse.outputs.updated == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Client added successfully!** Video generation has been triggered. Your marketing reel will be ready within 6 hours.'
            });
            github.rest.issues.update({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });

name: Process New Client from Frontend

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (from frontend form)'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  process-frontend-signup:
    runs-on: ubuntu-latest
    # Only run if issue has 'new-client' label or is manually triggered
    if: contains(github.event.issue.labels.*.name, 'new-client') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Parse Frontend Form and Add Client
        id: parse
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "🌐 Processing new client signup from frontend form"
          echo "Issue #$ISSUE_NUMBER"
          python .github/scripts/update_clients.py
          
      - name: Commit updated clients.json
        if: steps.parse.outputs.updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Maseer Frontend Bot"
          git add data/clients.json
          git commit -m "🆕 New client signup from frontend: Issue #${{ github.event.issue.number || github.event.inputs.issue_number }}" || echo "No changes"
          git push || echo "Nothing to push"
          
      - name: Trigger Video Generation Pipeline
        if: steps.parse.outputs.updated == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: main.yml
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Comment on Issue (Success)
        if: steps.parse.outputs.updated == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const brandName = '${{ steps.parse.outputs.brand_name }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Welcome to Maseer, ${brandName}!**\n\nYour brand has been registered successfully. Here's what happens next:\n\n🎬 **Video Production**: Our AI is now crafting your broadcast TV-quality marketing video\n⏱️ **Timeline**: Ready within 6 hours (next scheduled run)\n📺 **Style**: B Nazanin Bold typography + dramatic zoom effects + professional graphics\n📤 **Delivery**: You'll receive the video via Telegram\n\n**Track Progress**: [View Workflow Runs](https://github.com/${{ github.repository }}/actions)\n\n*This is an automated message from [Maseer Portal](https://hasinamusadiq.github.io/maseer-portal/)*`
            });
            github.rest.issues.update({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['new-client', 'processed']
            });
            
      - name: Comment on Issue (Failure)
        if: steps.parse.outputs.updated == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Registration Issue**\n\nWe encountered a problem processing your signup. Please check:\n- All required fields are filled\n- Logo URL is accessible\n- Colors are in hex format (e.g., #D32F2F)\n\n[Contact Support](https://github.com/${{ github.repository }}/issues) for assistance.`
            });

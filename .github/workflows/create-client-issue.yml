name: Create Client Issue

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Brand Name'
        required: true
        type: string
      local_name:
        description: 'Local Name (optional)'
        required: false
        type: string
      industry:
        description: 'Industry'
        required: true
        type: choice
        options:
          - Jewelry & Gold
          - Café & Restaurant
          - Fashion & Clothing
          - Technology & IT
          - Healthcare & Medical
          - Education & Training
          - Real Estate
          - Automotive
          - Beauty & Cosmetics
          - Construction & Materials
          - Consultancy & Services
          - Retail & Shopping
          - Travel & Hospitality
          - Agriculture
          - Handicrafts
      primary_color:
        description: 'Primary Color (hex)'
        required: true
        type: string
        default: '#6B21A8'
      secondary_color:
        description: 'Secondary Color (hex, optional)'
        required: false
        type: string
        default: '#EAB308'
      target_audience:
        description: 'Target Audience (optional)'
        required: false
        type: string
      key_offerings:
        description: 'Key Offerings (optional)'
        required: false
        type: string
      contact_info:
        description: 'Contact/WhatsApp (optional)'
        required: false
        type: string
      logo_base64:
        description: 'Logo Base64 (paste if large, optional)'
        required: false
        type: string
      language:
        description: 'Language'
        required: false
        type: choice
        options:
          - en
          - fa
          - ps
        default: 'en'

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Set defaults
        id: defs
        run: |
          echo "local_name=${{ github.event.inputs.local_name || 'N/A' }}" >> $GITHUB_OUTPUT
          echo "secondary=${{ github.event.inputs.secondary_color || '#EAB308' }}" >> $GITHUB_OUTPUT
          echo "audience=${{ github.event.inputs.target_audience || 'General Afghan market' }}" >> $GITHUB_OUTPUT
          echo "offerings=${{ github.event.inputs.key_offerings || 'Premium products/services' }}" >> $GITHUB_OUTPUT
          echo "contact=${{ github.event.inputs.contact_info || 'N/A' }}" >> $GITHUB_OUTPUT
          if [ -z "${{ github.event.inputs.logo_base64 }}" ]; then
            echo "logo=None" >> $GITHUB_OUTPUT
          else
            echo "logo=Included (see JSON below)" >> $GITHUB_OUTPUT
          fi

      - name: Create issue body file
        run: |
          echo "---" > body.txt
          echo "name: New Client Registration" >> body.txt
          echo "about: Register a new brand for AI video marketing" >> body.txt
          echo "title: \"New Client: ${{ github.event.inputs.brand_name }}\"" >> body.txt
          echo "labels: [new-client]" >> body.txt
          echo "---" >> body.txt
          echo "" >> body.txt
          echo "## New Brand Registration - Maseer Media Inc." >> body.txt
          echo "" >> body.txt
          echo "**Submitted:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> body.txt
          echo "**Status:** Standard" >> body.txt
          echo "" >> body.txt
          echo "### Brand Information" >> body.txt
          echo "| Field | Value |" >> body.txt
          echo "|-------|-------|" >> body.txt
          echo "| **Brand Name** | ${{ github.event.inputs.brand_name }} |" >> body.txt
          echo "| **Local Name** | ${{ steps.defs.outputs.local_name }} |" >> body.txt
          echo "| **Industry** | ${{ github.event.inputs.industry }} |" >> body.txt
          echo "| **Location** | Kabul, Afghanistan |" >> body.txt
          echo "" >> body.txt
          echo "### Visual Identity" >> body.txt
          echo "| Field | Value |" >> body.txt
          echo "|-------|-------|" >> body.txt
          echo "| **Primary Color** | ${{ github.event.inputs.primary_color }} |" >> body.txt
          echo "| **Secondary Color** | ${{ steps.defs.outputs.secondary }} |" >> body.txt
          echo "| **Logo** | ${{ steps.defs.outputs.logo }} |" >> body.txt
          echo "" >> body.txt
          echo "### Marketing Details" >> body.txt
          echo "| Field | Value |" >> body.txt
          echo "|-------|-------|" >> body.txt
          echo "| **Target Audience** | ${{ steps.defs.outputs.audience }} |" >> body.txt
          echo "| **Key Offerings** | ${{ steps.defs.outputs.offerings }} |" >> body.txt
          echo "| **Contact** | ${{ steps.defs.outputs.contact }} |" >> body.txt
          echo "" >> body.txt
          echo "### Raw Data (JSON)" >> body.txt
          echo '```json' >> body.txt
          echo "{" >> body.txt
          echo "  \"brand_name\": \"${{ github.event.inputs.brand_name }}\"," >> body.txt
          echo "  \"local_name\": \"${{ github.event.inputs.local_name }}\"," >> body.txt
          echo "  \"industry\": \"${{ github.event.inputs.industry }}\"," >> body.txt
          echo "  \"primary_color\": \"${{ github.event.inputs.primary_color }}\"," >> body.txt
          echo "  \"secondary_color\": \"${{ github.event.inputs.secondary_color }}\"," >> body.txt
          echo "  \"target_audience\": \"${{ github.event.inputs.target_audience }}\"," >> body.txt
          echo "  \"key_offerings\": \"${{ github.event.inputs.key_offerings }}\"," >> body.txt
          echo "  \"contact_info\": \"${{ github.event.inputs.contact_info }}\"," >> body.txt
          echo "  \"logo_base64\": \"${{ github.event.inputs.logo_base64 }}\"," >> body.txt
          echo "  \"language\": \"${{ github.event.inputs.language }}\"," >> body.txt
          echo "  \"request_sample\": true" >> body.txt
          echo "}" >> body.txt
          echo '```' >> body.txt

      - name: Create issue via API
        run: |
          BODY=$(cat body.txt | jq -Rs .)
          echo "{\"title\":\"New Client: ${{ github.event.inputs.brand_name }}\",\"body\":${BODY},\"labels\":[\"new-client\"]}" > payload.json
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN_MASEER }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/hasinamusadiq/maseer_automation/issues \
            -d @payload.json
